[package]
name = "audio-multiplexer"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Plays Windows system audio on multiple output devices simultaneously and in sync"
repository = "https://github.com/roemer2201/audio-multiplexer"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
dirs = "6.0"
eframe = "0.35"
hound = "3.5"
rubato = "3.0"
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
# Direct dependency because the #[implement] macro emits windows_core paths.
windows-core = "0.62"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Devices_FunctionDiscovery",
]
