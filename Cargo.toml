[package]
name = "audio-multiplexer"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Plays Windows system audio on multiple output devices simultaneously and in sync"
repository = "https://github.com/roemer2201/audio-multiplexer"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
hound = "3.5"
rubato = "3.0"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Devices_FunctionDiscovery",
]
