name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build and draft release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Build
        run: cargo build --release
      - name: Test
        run: cargo test --release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/audio-multiplexer.exe dist/
          Copy-Item README.md,LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath "audio-multiplexer-${{ github.ref_name }}-windows-x64.zip"
      - name: Draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: audio-multiplexer-*.zip
          draft: true
          generate_release_notes: true
